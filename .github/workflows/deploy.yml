name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Generate static HTML
        run: |
          cd public
          php -r "
            \$_SERVER['HTTP_HOST'] = 'carlosaugustonetonelima.github.io';
            \$_SERVER['REQUEST_URI'] = '/festivaldocrato/';
            \$_GET['page'] = 'home';
            ob_start();
            include 'index.php';
            \$html = ob_get_clean();
            file_put_contents('index.html', \$html);
          "

      - name: Fix asset paths for GitHub Pages subdirectory
        run: |
          sed -i 's|href="/assets/|href="/festivaldocrato/assets/|g' public/index.html
          sed -i 's|src="/assets/|src="/festivaldocrato/assets/|g' public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
