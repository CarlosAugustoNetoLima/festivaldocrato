name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Generate static HTML pages
        run: |
          BASE="/festivaldocrato"
          DIST="dist"
          mkdir -p $DIST

          generate() {
            local uri="$1"
            local outdir="$DIST$2"
            mkdir -p "$outdir"
            php -r "
              \$_SERVER['HTTP_HOST'] = 'carlosaugustonetonelima.github.io';
              \$_SERVER['REQUEST_URI'] = '$uri';
              ob_start();
              chdir('public');
              include 'public/index.php';
              \$html = ob_get_clean();
              \$html = str_replace('href=\"/assets/', 'href=\"$BASE/assets/', \$html);
              \$html = str_replace('src=\"/assets/', 'src=\"$BASE/assets/', \$html);
              \$html = str_replace('href=\"/', 'href=\"$BASE/', \$html);
              \$html = str_replace('action=\"/', 'action=\"$BASE/', \$html);
              file_put_contents('${outdir}/index.html', \$html);
            "
          }

          generate "/"              ""
          generate "/bilheteira"    "/bilheteira"
          generate "/lineup"        "/lineup"
          generate "/artistas"      "/artistas"
          generate "/campismo"      "/campismo"
          generate "/loja"          "/loja"
          generate "/noticias"      "/noticias"
          generate "/sobre"         "/sobre"
          generate "/info"          "/info"
          generate "/como-chegar"   "/como-chegar"
          generate "/contactos"     "/contactos"

          # Copy static assets
          cp -r public/assets $DIST/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
